[project]
name = "ai-assistant"
version = "0.1.0"
description = "Expose selected ComfyUI canvas context to a local AI assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Repository = "https://github.com/alksef/ComfyUI-AIAssistant"

[tool.comfy]
PublisherId = "alksef"
DisplayName = "aiAssistant"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

